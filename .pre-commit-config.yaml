repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: no-model-weights
        name: forbid model weights / recordings
        entry: "forbidden binary: do not commit model weights or recordings"
        language: fail
        files: '\.(ckpt|safetensors|onnx|pt|mp3|m4a)$'
